name: 15分ごとのレース更新とPDCA

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autorace-static-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: ソースを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: 必要なパッケージを準備
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: 出走表・結果・学習状態を更新
        run: node scripts/static-update.mjs
      - name: 最新データを保存
        run: |
          git config user.name "race-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update race data and PDCA [skip ci]"
            git push
          fi
